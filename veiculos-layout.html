<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CondoEconomy — Veículos (Portaria)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#FAFAFA; --card:#FFFFFF; --border:#E4E4E8;
    --text:#16181D; --dim:#75767E; --faint:#A9AAB1;
    --primary:#4338CA; --primary-dim:#EEF0FF; --primary-ink:#FFFFFF;
    --success:#16A34A; --success-dim:#EAF8EF;
    --warning:#B45309; --warning-dim:#FEF3E2;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0E0F12; --card:#17181D; --border:#262832;
      --text:#ECEDF0; --dim:#90919A; --faint:#5D5E67;
      --primary:#6C63F5; --primary-dim:#201E3A; --primary-ink:#FFFFFF;
      --success:#34D399; --success-dim:#122A22;
      --warning:#F5A855; --warning-dim:#2E2214;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0E0F12; --card:#17181D; --border:#262832;
    --text:#ECEDF0; --dim:#90919A; --faint:#5D5E67;
    --primary:#6C63F5; --primary-dim:#201E3A; --primary-ink:#FFFFFF;
    --success:#34D399; --success-dim:#122A22;
    --warning:#F5A855; --warning-dim:#2E2214;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Manrope',system-ui,sans-serif; display:flex; justify-content:center; }
  .phone { width:100%; max-width:412px; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }

  header.top { padding:calc(16px + env(safe-area-inset-top,0px)) 18px 6px; display:flex; justify-content:space-between; align-items:center; }
  .h-title { font-size:19px; font-weight:800; letter-spacing:-.01em; }
  .h-sub { font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--primary); font-weight:600; margin-top:2px; text-transform:uppercase; }
  .h-actions { display:flex; gap:8px; }
  .icon-btn { width:40px; height:40px; border-radius:11px; border:1px solid var(--border); background:var(--card); display:grid; place-items:center; color:var(--text); cursor:pointer; }
  .icon-btn svg { width:18px; height:18px; }

  .page-head { padding:10px 18px 0; }
  .eyebrow { font-size:11px; font-weight:700; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; }
  h1 { font-size:21px; font-weight:800; margin:3px 0 14px; letter-spacing:-.01em; }

  .lookup { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px; }
  .lbl { font-size:11px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; display:block; }
  .lk-row { display:flex; gap:10px; }
  .in-wrap { position:relative; flex:1; }
  .in-wrap > svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--faint); }
  .in-wrap input { width:100%; height:54px; padding:0 38px 0 40px; border-radius:12px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
  .in-wrap input::placeholder { color:var(--faint); font-weight:500; letter-spacing:.06em; }
  .in-wrap input:focus-visible { outline:2px solid var(--primary); outline-offset:1px; }
  .clear { position:absolute; right:8px; top:50%; transform:translateY(-50%); width:30px; height:30px; border:none; background:none; color:var(--faint); cursor:pointer; display:none; place-items:center; }
  .clear svg { width:16px; height:16px; }
  .clear.show { display:grid; }
  .go { height:54px; padding:0 18px; border-radius:12px; border:none; background:var(--primary); color:var(--primary-ink); font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; }
  .go:disabled { opacity:.4; cursor:not-allowed; }
  .hint { font-size:11.5px; color:var(--dim); margin-top:10px; line-height:1.45; }
  .hint.err { color:var(--warning); }

  main { flex:1; padding:16px 18px 110px; display:flex; flex-direction:column; gap:20px; }
  .sec-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); margin:0 0 10px; }

  .list { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .row { width:100%; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:13px 14px; border:none; border-bottom:1px solid var(--border); background:none; color:var(--text); font-family:inherit; text-align:left; cursor:pointer; }
  .row:last-child { border-bottom:none; }
  .r-plate { font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; letter-spacing:.05em; }
  .r-sub { font-size:11.5px; color:var(--dim); margin-top:2px; }
  .r-meta { font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--faint); text-align:right; flex:none; }
  .r-meta b { display:block; font-weight:700; margin-bottom:2px; }
  .k-ok { color:var(--success); } .k-vis { color:var(--primary); } .k-no { color:var(--warning); }

  .res { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; }
  .res.ok { border-color:var(--success); }
  .res.no { border-color:var(--warning); }
  .res-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .badge { font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:700; padding:4px 9px; border-radius:999px; }
  .b-ok { background:var(--success-dim); color:var(--success); }
  .b-vis { background:var(--primary-dim); color:var(--primary); }
  .b-no { background:var(--warning-dim); color:var(--warning); }
  .plate { display:inline-block; border:2px solid var(--text); border-radius:9px; padding:6px 14px; font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:600; letter-spacing:.1em; }
  .car { display:flex; align-items:center; gap:8px; margin:12px 0 4px; font-size:14px; font-weight:700; }
  .sw { width:14px; height:14px; border-radius:50%; border:1px solid var(--border); flex:none; }
  .car span { color:var(--dim); font-weight:500; }
  .kv { margin-top:12px; border-top:1px solid var(--border); }
  .kv div { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .kv div:last-child { border-bottom:none; }
  .kv dt, .kv .k { color:var(--dim); }
  .kv .v { font-weight:700; text-align:right; }
  .kv .v.m { font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .acts { display:grid; gap:10px; margin-top:12px; }
  .btn { font-family:inherit; font-size:14px; font-weight:700; height:50px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; }
  .btn.primary { background:var(--primary); border-color:var(--primary); color:var(--primary-ink); }
  .no-text { font-size:13px; color:var(--dim); line-height:1.5; margin:12px 0 0; }

  nav.bottom {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:412px;
    background:var(--card); border-top:1px solid var(--border);
    padding:9px 4px calc(9px + env(safe-area-inset-bottom,0px)); display:grid; grid-template-columns:repeat(6,1fr); z-index:5;
  }
  nav.bottom a { display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none; color:var(--faint); font-size:9.5px; font-weight:600; position:relative; }
  nav.bottom a svg { width:20px; height:20px; }
  nav.bottom a.active { color:var(--primary); }
  .nav-badge { position:absolute; top:-5px; left:calc(50% + 4px); background:var(--primary); color:#fff; font-size:9px; font-weight:700; min-width:15px; height:15px; border-radius:999px; display:grid; place-items:center; padding:0 4px; }

  .toast { position:fixed; bottom:84px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--text); color:var(--bg); font-size:13px; font-weight:600; padding:11px 18px; border-radius:10px; opacity:0; transition:transform .25s, opacity .25s; z-index:12; white-space:nowrap; }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>
<div class="phone">

  <header class="top">
    <div><div class="h-title">Portaria</div><div class="h-sub">Condomínio Mar Egeu</div></div>
    <div class="h-actions">
      <button class="icon-btn" id="themeBtn" aria-label="Alternar tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="icon-btn" aria-label="Sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </header>

  <div class="page-head">
    <div class="eyebrow">Garagem e acesso</div>
    <h1>Consultar placa</h1>
    <div class="lookup">
      <span class="lbl">Placa do veículo</span>
      <div class="lk-row">
        <div class="in-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="plate" placeholder="ABC-1D23" autocomplete="off" autocapitalize="characters" spellcheck="false">
          <button class="clear" id="clear" aria-label="Limpar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <button class="go" id="go" disabled>Consultar</button>
      </div>
      <div class="hint" id="hint">Digite a placa inteira, ou só um pedaço para ver sugestões.</div>
    </div>
  </div>

  <main id="below"></main>

  <nav class="bottom">
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 3l9 7"/><path d="M5 9v11h14V9"/></svg>Início</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/></svg>Visitantes</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Encomendas<span class="nav-badge">4</span></a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>Reservas</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Ouvidoria</a>
    <a href="#" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2-5a2 2 0 0 1 2-1.3h10a2 2 0 0 1 2 1.3l2 5v5H3z"/><circle cx="7.5" cy="18" r="1.5"/><circle cx="16.5" cy="18" r="1.5"/></svg>Veículos</a>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script>
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function norm(s) { return s.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 7); }
  function fmtPlate(p) { return p.length > 3 ? p.slice(0, 3) + '-' + p.slice(3) : p; }
  function validPlate(p) { return /^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(p); }
  function ago(min) { return new Date(Date.now() - min * 60000); }
  function rel(d) {
    var m = Math.floor((Date.now() - d.getTime()) / 60000);
    if (m < 1) return 'agora';
    if (m < 60) return 'há ' + m + ' min';
    var h = Math.floor(m / 60);
    return h < 24 ? 'há ' + h + ' h' : 'há ' + Math.floor(h / 24) + ' d';
  }
  function stay(d) {
    var m = Math.floor((Date.now() - d.getTime()) / 60000);
    return m < 60 ? m + ' min' : Math.floor(m / 60) + 'h ' + pad(m % 60);
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  var residents = [
    {plate:'ABC1D23', model:'Fiat Argo', color:'Prata', hex:'#DFE3E8', unit:'Bloco 11 · Apto 012', who:'Carlos Silva', vaga:'G-14'},
    {plate:'RDX9F41', model:'Honda Civic', color:'Preto', hex:'#1C1D22', unit:'Bloco 11 · Apto 012', who:'Carlos Silva', vaga:'G-15'},
    {plate:'JQP4C21', model:'Jeep Renegade', color:'Verde musgo', hex:'#4B5320', unit:'Bloco 11 · Apto 012', who:'Carlos Silva', vaga:'G-16'},
    {plate:'KLM8E55', model:'Chevrolet Onix', color:'Branco', hex:'#F5F5F5', unit:'Bloco 03 · Apto 102', who:'Fernanda Lima', vaga:'G-22'},
    {plate:'PQR2G90', model:'Toyota Corolla', color:'Cinza', hex:'#6B7280', unit:'Bloco 05 · Apto 201', who:'Ana Beatriz', vaga:'G-07'},
    {plate:'TUV5H18', model:'Hyundai HB20', color:'Vermelho', hex:'#B91C1C', unit:'Bloco 08 · Apto 011', who:'Jorge Santos', vaga:'G-31'}
  ];
  var visitors = [
    {plate:'QRS4F28', model:'Fiat Strada', color:'Branco', hex:'#F5F5F5', who:'Jorge (eletricista)', dest:'Bloco 08 · Apto 011', inAt:ago(95)},
    {plate:'HRV3K44', model:'Honda HR-V', color:'Prata', hex:'#DFE3E8', who:'Pedro Henrique (visita)', dest:'Bloco 07 · Apto 302', inAt:ago(30)}
  ];
  var recents = [{plate:'ABC1D23', at:ago(12)}, {plate:'ZZZ9Z99', at:ago(64)}, {plate:'QRS4F28', at:ago(95)}];
  var result = null;

  function find(p) {
    var r = residents.filter(function (x) { return x.plate === p; })[0];
    if (r) return {type:'ok', d:r};
    var v = visitors.filter(function (x) { return x.plate === p; })[0];
    return v ? {type:'vis', d:v} : {type:'no', d:{plate:p}};
  }
  function kindOf(p) { return find(p).type; }

  var input = document.getElementById('plate'), goBtn = document.getElementById('go'), hint = document.getElementById('hint'), clearBtn = document.getElementById('clear'), below = document.getElementById('below');

  function rowHtml(plate, sub, meta, kind) {
    return '<button class="row" data-plate="' + plate + '"><div><div class="r-plate">' + fmtPlate(plate) + '</div><div class="r-sub">' + sub + '</div></div><div class="r-meta">' + meta + '</div></button>';
  }

  function renderBelow() {
    var p = norm(input.value);
    if (result) { below.innerHTML = resultHtml(result); return; }
    if (p.length >= 2 && p.length < 7) {
      var all = residents.concat(visitors).filter(function (x) { return x.plate.indexOf(p) > -1; }).slice(0, 5);
      below.innerHTML = all.length
        ? '<div><p class="sec-title">Sugestões</p><div class="list">' + all.map(function (x) {
            return rowHtml(x.plate, esc(x.model) + ' · ' + esc(x.color), x.vaga ? '<b class="k-ok">MORADOR</b>' + esc(x.unit) : '<b class="k-vis">VISITANTE</b>no local', '');
          }).join('') + '</div></div>'
        : '<div class="hint">Nenhuma placa parecida entre moradores e visitantes no local.</div>';
      return;
    }
    var inside = '<div><p class="sec-title">Visitantes com veículo no local</p><div class="list">' + visitors.map(function (v) {
      return rowHtml(v.plate, esc(v.who) + ' → ' + esc(v.dest), '<b>' + stay(v.inAt) + '</b>no local', '');
    }).join('') + '</div></div>';
    var rec = '<div><p class="sec-title">Consultas recentes</p><div class="list">' + recents.slice(0, 4).map(function (r) {
      var k = kindOf(r.plate), lab = k === 'ok' ? '<b class="k-ok">MORADOR</b>' : k === 'vis' ? '<b class="k-vis">VISITANTE</b>' : '<b class="k-no">NÃO ENCONTRADA</b>';
      return rowHtml(r.plate, rel(r.at), lab, '');
    }).join('') + '</div></div>';
    below.innerHTML = inside + rec;
  }

  function resultHtml(r) {
    var d = r.d, p = fmtPlate(d.plate);
    if (r.type === 'no') {
      return '<div class="res no"><div class="res-top"><span class="badge b-no">NÃO ENCONTRADA</span></div><span class="plate">' + p + '</span>' +
        '<p class="no-text">Nenhum morador ou visitante no local com essa placa. Se o veículo está entrando agora, registre o visitante com a placa já preenchida.</p>' +
        '<div class="acts"><button class="btn primary" data-act="reg">Registrar como visitante</button><button class="btn" data-act="new">Nova consulta</button></div></div>';
    }
    var car = '<div class="car"><span class="sw" style="background:' + d.hex + '"></span>' + esc(d.model) + ' <span>· ' + esc(d.color) + '</span></div>';
    if (r.type === 'ok') {
      return '<div class="res ok"><div class="res-top"><span class="badge b-ok">VEÍCULO DE MORADOR</span></div><span class="plate">' + p + '</span>' + car +
        '<div class="kv"><div><span class="k">Unidade</span><span class="v m">' + esc(d.unit) + '</span></div><div><span class="k">Morador</span><span class="v">' + esc(d.who) + '</span></div><div><span class="k">Vaga</span><span class="v m">' + esc(d.vaga) + '</span></div></div>' +
        '<div class="acts"><button class="btn primary" data-act="warn">Avisar morador</button><button class="btn" data-act="new">Nova consulta</button></div></div>';
    }
    return '<div class="res"><div class="res-top"><span class="badge b-vis">VISITANTE NO LOCAL</span></div><span class="plate">' + p + '</span>' + car +
      '<div class="kv"><div><span class="k">Visitante</span><span class="v">' + esc(d.who) + '</span></div><div><span class="k">Destino</span><span class="v m">' + esc(d.dest) + '</span></div><div><span class="k">Entrada</span><span class="v m">' + hm(d.inAt) + ' · ' + stay(d.inAt) + ' no local</span></div></div>' +
      '<div class="acts"><button class="btn primary" data-act="warn">Avisar morador do destino</button><button class="btn" data-act="new">Nova consulta</button></div></div>';
  }

  function updateControls() {
    var p = norm(input.value);
    clearBtn.classList.toggle('show', input.value.length > 0);
    var ok = p.length === 7 && validPlate(p);
    goBtn.disabled = !ok;
    if (p.length === 7 && !ok) { hint.textContent = 'Formato inválido. Use ABC-1D23 (Mercosul) ou ABC-1234.'; hint.className = 'hint err'; }
    else { hint.textContent = 'Digite a placa inteira, ou só um pedaço para ver sugestões.'; hint.className = 'hint'; }
  }

  function consult(p) {
    input.value = fmtPlate(p);
    result = find(p);
    recents = recents.filter(function (r) { return r.plate !== p; });
    recents.unshift({plate:p, at:new Date()});
    updateControls(); renderBelow();
  }
  function reset() { input.value = ''; result = null; updateControls(); renderBelow(); input.focus(); }

  input.addEventListener('input', function () {
    var p = norm(input.value);
    input.value = fmtPlate(p);
    result = null; updateControls(); renderBelow();
  });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !goBtn.disabled) consult(norm(input.value)); });
  goBtn.addEventListener('click', function () { consult(norm(input.value)); });
  clearBtn.addEventListener('click', reset);

  function toast(t) {
    var el = document.getElementById('toast');
    el.textContent = t; el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 2200);
  }
  below.addEventListener('click', function (e) {
    var row = e.target.closest('[data-plate]');
    if (row) return consult(row.dataset.plate);
    var b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'new') reset();
    if (b.dataset.act === 'warn') toast('Morador avisado no app');
    if (b.dataset.act === 'reg') toast('Abrindo cadastro de visitante com a placa');
  });

  document.getElementById('themeBtn').addEventListener('click', function () {
    var root = document.documentElement, cur = root.getAttribute('data-theme');
    var isDark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  });

  updateControls(); renderBelow();
</script>
</body>
</html>
