<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CondoEconomy — Reservas (Síndico)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#FAFAFA; --card:#FFFFFF; --border:#E4E4E8;
    --text:#16181D; --dim:#75767E; --faint:#A9AAB1;
    --primary:#4338CA; --primary-dim:#EEF0FF; --primary-ink:#FFFFFF;
    --success:#16A34A; --success-dim:#EAF8EF;
    --warning:#B45309; --warning-dim:#FEF3E2;
    --danger:#DC2626; --danger-dim:#FDECEC;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0E0F12; --card:#17181D; --border:#262832;
      --text:#ECEDF0; --dim:#90919A; --faint:#5D5E67;
      --primary:#6C63F5; --primary-dim:#201E3A; --primary-ink:#FFFFFF;
      --success:#34D399; --success-dim:#122A22;
      --warning:#F5A855; --warning-dim:#2E2214;
      --danger:#F87171; --danger-dim:#331A1A;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0E0F12; --card:#17181D; --border:#262832;
    --text:#ECEDF0; --dim:#90919A; --faint:#5D5E67;
    --primary:#6C63F5; --primary-dim:#201E3A; --primary-ink:#FFFFFF;
    --success:#34D399; --success-dim:#122A22;
    --warning:#F5A855; --warning-dim:#2E2214;
    --danger:#F87171; --danger-dim:#331A1A;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Manrope',system-ui,sans-serif; display:flex; justify-content:center; }
  .phone { width:100%; max-width:412px; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }

  header.top { padding:calc(16px + env(safe-area-inset-top,0px)) 18px 6px; display:flex; justify-content:space-between; align-items:center; }
  .h-title { font-size:19px; font-weight:800; letter-spacing:-.01em; }
  .h-sub { font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--primary); font-weight:600; margin-top:2px; text-transform:uppercase; }
  .h-actions { display:flex; gap:8px; }
  .icon-btn { width:40px; height:40px; border-radius:11px; border:1px solid var(--border); background:var(--card); display:grid; place-items:center; color:var(--text); cursor:pointer; }
  .icon-btn svg { width:18px; height:18px; }

  .page-head { padding:10px 18px 0; }
  .eyebrow { font-size:11px; font-weight:700; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; }
  h1 { font-size:21px; font-weight:800; margin:3px 0 14px; letter-spacing:-.01em; }
  .tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:3px; padding:3px; background:var(--card); border:1px solid var(--border); border-radius:12px; }
  .tab { border:none; background:none; font-family:inherit; font-size:12px; font-weight:700; color:var(--dim); padding:9px 2px; border-radius:9px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .tab b { font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; color:var(--text); }
  .tab.active { background:var(--primary-dim); color:var(--primary); }
  .tab.active b { color:var(--primary); }

  main { flex:1; padding:14px 18px 110px; display:flex; flex-direction:column; gap:10px; }
  .day-h { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); margin:8px 0 0; }
  .day-h:first-child { margin-top:0; }

  .r-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; }
  .r-card.block { border-color:var(--danger); }
  .r-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .r-area { display:flex; align-items:center; gap:10px; }
  .r-ico { width:36px; height:36px; border-radius:10px; background:var(--bg); border:1px solid var(--border); display:grid; place-items:center; color:var(--dim); flex:none; }
  .r-ico svg { width:17px; height:17px; }
  .r-name { font-size:14.5px; font-weight:700; }
  .r-when { font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--dim); margin-top:2px; }
  .r-ago { font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--faint); white-space:nowrap; }
  .badge { font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:700; padding:4px 8px; border-radius:999px; white-space:nowrap; flex:none; }
  .b-ok { background:var(--success-dim); color:var(--success); }
  .b-no { background:var(--danger-dim); color:var(--danger); }
  .r-who { font-size:13px; margin-top:12px; }
  .r-who span { font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .r-meta { display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); font-size:12.5px; color:var(--dim); }
  .r-meta b { font-family:'IBM Plex Mono',monospace; color:var(--text); font-weight:600; }
  .fin { font-size:11.5px; margin-top:8px; display:flex; align-items:center; gap:6px; color:var(--dim); }
  .fin i { width:7px; height:7px; border-radius:50%; background:var(--success); }
  .fin.late { color:var(--warning); font-weight:600; }
  .fin.late i { background:var(--warning); }
  .note { font-size:12px; line-height:1.5; border-radius:10px; padding:10px 12px; margin-top:10px; }
  .note.warn { background:var(--warning-dim); color:var(--warning); }
  .note.bad { background:var(--danger-dim); color:var(--danger); }
  .note.info { background:var(--bg); color:var(--dim); border:1px solid var(--border); }
  .acts { display:grid; grid-template-columns:1fr 1.3fr; gap:10px; margin-top:12px; }
  .acts.one { grid-template-columns:1fr; }
  .btn { font-family:inherit; font-size:14px; font-weight:700; height:48px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; }
  .btn.primary { background:var(--primary); border-color:var(--primary); color:var(--primary-ink); }
  .btn.danger { background:var(--danger); border-color:var(--danger); color:#fff; }
  .btn.ghost-danger { color:var(--danger); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }

  .empty { text-align:center; padding:40px 20px; background:var(--card); border:1px solid var(--border); border-radius:16px; }
  .empty .e-ico { width:60px; height:60px; border-radius:16px; background:var(--success-dim); color:var(--success); display:grid; place-items:center; margin:0 auto 14px; }
  .empty .e-ico svg { width:28px; height:28px; }
  .empty .e-ico.n { background:var(--bg); color:var(--faint); border:1px solid var(--border); }
  .empty .e-t { font-size:15px; font-weight:800; margin-bottom:4px; }
  .empty .e-s { font-size:12.5px; color:var(--dim); line-height:1.5; }

  nav.bottom {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:412px;
    background:var(--card); border-top:1px solid var(--border);
    padding:9px 4px calc(9px + env(safe-area-inset-bottom,0px)); display:grid; grid-template-columns:repeat(5,1fr); z-index:5;
  }
  nav.bottom a { display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none; color:var(--faint); font-size:9.5px; font-weight:600; position:relative; }
  nav.bottom a svg { width:20px; height:20px; }
  nav.bottom a.active { color:var(--primary); }
  .nav-badge { position:absolute; top:-5px; left:calc(50% + 4px); background:var(--primary); color:#fff; font-size:9px; font-weight:700; min-width:15px; height:15px; border-radius:999px; display:grid; place-items:center; padding:0 4px; }

  .overlay { position:fixed; inset:0; background:rgba(10,10,14,.45); opacity:0; pointer-events:none; transition:opacity .2s; z-index:10; }
  .overlay.show { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; left:50%; bottom:0; transform:translate(-50%,100%); width:100%; max-width:412px; background:var(--card); border-radius:20px 20px 0 0; padding:20px 20px calc(22px + env(safe-area-inset-bottom,0px)); z-index:11; transition:transform .25s ease; max-height:92vh; overflow-y:auto; }
  .sheet.show { transform:translate(-50%,0); }
  .sheet h2 { font-size:17px; font-weight:800; margin:0 0 14px; }
  .kv { border-top:1px solid var(--border); margin-bottom:14px; }
  .kv div { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .kv .k { color:var(--dim); }
  .kv .v { font-weight:700; text-align:right; }
  .kv .v.m { font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .lbl { font-size:12px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; display:block; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .chip { border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; font-size:12.5px; font-weight:600; padding:10px 12px; border-radius:10px; cursor:pointer; }
  .chip.sel { border-color:var(--primary); background:var(--primary-dim); color:var(--primary); }
  .sheet input[type="text"] { width:100%; height:46px; padding:0 13px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; font-size:14px; margin-bottom:14px; }
  .s-note { font-size:12px; line-height:1.5; color:var(--dim); background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:14px; }
  .sheet-actions { display:grid; grid-template-columns:1fr 1.4fr; gap:10px; }

  .toast { position:fixed; bottom:84px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--text); color:var(--bg); font-size:13px; font-weight:600; padding:11px 18px; border-radius:10px; opacity:0; transition:transform .25s, opacity .25s; z-index:12; white-space:nowrap; max-width:92%; overflow:hidden; text-overflow:ellipsis; }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>
<div class="phone">

  <header class="top">
    <div><div class="h-title">Síndico</div><div class="h-sub">Ana Laura (síndica)</div></div>
    <div class="h-actions">
      <button class="icon-btn" id="themeBtn" aria-label="Alternar tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="icon-btn" aria-label="Sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </header>

  <div class="page-head">
    <div class="eyebrow">Aprovações</div>
    <h1>Reservas</h1>
    <div class="tabs" id="tabs">
      <button class="tab active" data-f="pendente">Pendentes<b id="c-pendente">0</b></button>
      <button class="tab" data-f="aprovada">Aprovadas<b id="c-aprovada">0</b></button>
      <button class="tab" data-f="recusada">Recusadas<b id="c-recusada">0</b></button>
    </div>
  </div>

  <main id="list"></main>

  <nav class="bottom">
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>Avisos</a>
    <a href="#" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>Reservas<span class="nav-badge" id="navBadge">0</span></a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>Assembleia</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v4M12 14h.01"/></svg>Ouvidoria<span class="nav-badge">3</span></a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 3l9 7"/><path d="M5 9v11h14V9"/></svg>Condomínio</a>
  </nav>

  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  var NOW = new Date();
  function at(dayOff, h, m) { var d = new Date(NOW); d.setDate(d.getDate() + dayOff); d.setHours(h, m || 0, 0, 0); return d; }
  function ago(min) { return new Date(Date.now() - min * 60000); }
  function rel(d) {
    var m = Math.floor((Date.now() - d.getTime()) / 60000);
    if (m < 1) return 'agora';
    if (m < 60) return 'há ' + m + ' min';
    var h = Math.floor(m / 60);
    return h < 24 ? 'há ' + h + ' h' : 'há ' + Math.floor(h / 24) + (Math.floor(h / 24) === 1 ? ' dia' : ' dias');
  }
  function dayLabel(d) {
    var t = new Date(NOW); t.setHours(0, 0, 0, 0);
    var diff = Math.round((new Date(d).setHours(0, 0, 0, 0) - t.getTime()) / 86400000);
    if (diff === 0) return 'Hoje';
    if (diff === 1) return 'Amanhã';
    return d.toLocaleDateString('pt-BR', {weekday:'short', day:'numeric', month:'short'}).replace('.', '').replace(/^./, function (c) { return c.toUpperCase(); });
  }
  function money(v) { return 'R$ ' + v.toFixed(2).replace('.', ','); }

  var ICON = {
    'Salão de festas': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>',
    'Churrasqueira': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v4M8 21v-6M16 3v10M16 21v-4M4 7h16M4 17h16"/></svg>'
  };
  var FEE = {'Salão de festas':250, 'Churrasqueira':80};

  var items = [
    {id:1, area:'Salão de festas', unit:'Bloco 05 · Apto 201', who:'Ana Beatriz', status:'pendente', start:at(6, 19), end:at(6, 23), guests:25, req:ago(180), fin:'ok'},
    {id:2, area:'Salão de festas', unit:'Bloco 11 · Apto 012', who:'Carlos Silva', status:'pendente', start:at(6, 20), end:at(6, 23, 30), guests:18, req:ago(26 * 60), fin:'ok'},
    {id:3, area:'Churrasqueira', unit:'Bloco 08 · Apto 011', who:'Jorge Santos', status:'pendente', start:at(3, 12), end:at(3, 16), guests:8, req:ago(300), fin:'late'},
    {id:4, area:'Churrasqueira', unit:'Bloco 03 · Apto 102', who:'Fernanda Lima', status:'aprovada', start:at(1, 18), end:at(1, 22), guests:12, req:ago(3 * 1440), decided:ago(2 * 1440), fin:'ok'},
    {id:5, area:'Salão de festas', unit:'Bloco 07 · Apto 302', who:'João Lima', status:'aprovada', start:at(9, 15), end:at(9, 20), guests:30, req:ago(4 * 1440), decided:ago(3 * 1440), fin:'ok'},
    {id:6, area:'Salão de festas', unit:'Bloco 14 · Apto 004', who:'Rosa Alves', status:'recusada', start:at(2, 19), end:at(2, 23), guests:12, req:ago(2 * 1440), decided:ago(1440), reason:'Área em manutenção', fin:'ok'}
  ];
  var filter = 'pendente', cur = null, mode = null, reason = null;

  function overlap(a, b) { return a.area === b.area && a.id !== b.id && a.start < b.end && b.start < a.end; }
  function byId(id) { return items.filter(function (x) { return x.id === +id; })[0]; }

  function card(r) {
    var head = '<div class="r-top"><div class="r-area"><div class="r-ico">' + ICON[r.area] + '</div><div><div class="r-name">' + r.area + '</div><div class="r-when">' + dayLabel(r.start) + ' · ' + hm(r.start) + '–' + hm(r.end) + '</div></div></div>';
    var who = '<div class="r-who"><span>' + esc(r.unit) + '</span> · ' + esc(r.who) + '</div>';
    var meta = '<div class="r-meta"><span><b>' + r.guests + '</b> convidados</span><span>Taxa <b>' + money(FEE[r.area]) + '</b></span></div>';
    if (r.status === 'pendente') {
      var blocker = items.filter(function (o) { return o.status === 'aprovada' && overlap(r, o); })[0];
      var rival = items.filter(function (o) { return o.status === 'pendente' && overlap(r, o); })[0];
      var notes = '';
      if (blocker) notes += '<div class="note bad">Conflita com reserva já aprovada (' + esc(blocker.unit) + ', ' + hm(blocker.start) + '–' + hm(blocker.end) + '). Não dá para aprovar.</div>';
      else if (rival) notes += '<div class="note warn">Concorre com outra solicitação no mesmo horário (' + esc(rival.unit) + ', pedida ' + rel(rival.req) + '). Aprovar uma bloqueia a outra.</div>';
      var fin = '<div class="fin' + (r.fin === 'late' ? ' late' : '') + '"><i></i>' + (r.fin === 'late' ? 'Unidade com 1 boleto vencido' : 'Unidade em dia') + '</div>';
      return '<div class="r-card' + (blocker ? ' block' : '') + '">' + head + '<span class="r-ago">' + rel(r.req) + '</span></div>' + who + meta + fin + notes +
        '<div class="acts"><button class="btn" data-act="reject" data-id="' + r.id + '">Recusar</button><button class="btn primary" data-act="approve" data-id="' + r.id + '"' + (blocker ? ' disabled' : '') + '>Aprovar</button></div></div>';
    }
    var badge = r.status === 'aprovada' ? '<span class="badge b-ok">APROVADA</span>' : '<span class="badge b-no">' + (r.status === 'cancelada' ? 'CANCELADA' : 'RECUSADA') + '</span>';
    var extra = r.status === 'aprovada' ? '<div class="acts one"><button class="btn ghost-danger" data-act="cancel" data-id="' + r.id + '">Cancelar reserva</button></div>'
      : (r.reason ? '<div class="note info">Motivo informado ao morador: ' + esc(r.reason) + '</div>' : '');
    return '<div class="r-card">' + head + badge + '</div>' + who + meta + extra + '</div>';
  }

  function render() {
    ['pendente', 'aprovada'].forEach(function (s) {
      document.getElementById('c-' + s).textContent = items.filter(function (r) { return r.status === s; }).length;
    });
    document.getElementById('c-recusada').textContent = items.filter(function (r) { return r.status === 'recusada' || r.status === 'cancelada'; }).length;
    var pend = items.filter(function (r) { return r.status === 'pendente'; }).length;
    var nb = document.getElementById('navBadge'); nb.textContent = pend; nb.style.display = pend ? 'grid' : 'none';

    var shown = items.filter(function (r) { return filter === 'recusada' ? (r.status === 'recusada' || r.status === 'cancelada') : r.status === filter; });
    shown.sort(function (a, b) { return filter === 'pendente' ? a.req - b.req : a.start - b.start; });
    var list = document.getElementById('list');
    if (!shown.length) {
      list.innerHTML = filter === 'pendente'
        ? '<div class="empty"><div class="e-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="m9 11 3 3L22 4"/></svg></div><div class="e-t">Tudo em dia!</div><div class="e-s">Não há reservas aguardando sua aprovação.</div></div>'
        : '<div class="empty"><div class="e-ico n"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg></div><div class="e-t">' + (filter === 'aprovada' ? 'Nenhuma reserva aprovada' : 'Nenhuma reserva recusada') + '</div><div class="e-s">' + (filter === 'aprovada' ? 'As reservas aprovadas aparecem aqui, em ordem de data.' : 'Recusas e cancelamentos ficam registrados aqui.') + '</div></div>';
      return;
    }
    var out = '', last = '';
    shown.forEach(function (r) {
      if (filter === 'aprovada') { var l = dayLabel(r.start); if (l !== last) { out += '<div class="day-h">' + l + '</div>'; last = l; } }
      out += card(r);
    });
    list.innerHTML = out;
  }

  function toast(t) {
    var el = document.getElementById('toast');
    el.textContent = t; el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 2400);
  }

  var overlay = document.getElementById('overlay'), sheet = document.getElementById('sheet');
  var REASONS = ['Horário indisponível', 'Área em manutenção', 'Fora das regras do regimento', 'Outro motivo'];
  function openSheet(m, id) {
    mode = m; cur = byId(id); reason = null;
    var r = cur;
    var kv = '<div class="kv"><div><span class="k">Área</span><span class="v">' + r.area + '</span></div><div><span class="k">Quando</span><span class="v m">' + dayLabel(r.start) + ' · ' + hm(r.start) + '–' + hm(r.end) + '</span></div><div><span class="k">Unidade</span><span class="v m">' + esc(r.unit) + '</span></div><div><span class="k">Morador</span><span class="v">' + esc(r.who) + '</span></div></div>';
    if (m === 'approve') {
      var rival = items.some(function (o) { return o.status === 'pendente' && overlap(r, o); });
      sheet.innerHTML = '<h2>Aprovar reserva</h2>' + kv +
        '<div class="s-note">A taxa de <b>' + money(FEE[r.area]) + '</b> entra automaticamente no próximo boleto da unidade e o morador é notificado.' + (rival ? ' Outra solicitação para o mesmo horário ficará bloqueada.' : '') + '</div>' +
        '<div class="sheet-actions"><button class="btn" data-sc="close">Voltar</button><button class="btn primary" data-sc="ok">Confirmar aprovação</button></div>';
    } else {
      sheet.innerHTML = '<h2>' + (m === 'reject' ? 'Recusar reserva' : 'Cancelar reserva aprovada') + '</h2>' + kv +
        '<span class="lbl">Motivo (o morador vê)</span><div class="chips" id="rs">' + REASONS.map(function (x) { return '<button type="button" class="chip" data-r="' + x + '">' + x + '</button>'; }).join('') + '</div>' +
        (m === 'cancel' ? '<div class="s-note">A taxa é removida do boleto e o morador é notificado do cancelamento.</div>' : '') +
        '<div class="sheet-actions"><button class="btn" data-sc="close">Voltar</button><button class="btn danger" data-sc="ok" id="okBtn" disabled>' + (m === 'reject' ? 'Confirmar recusa' : 'Cancelar reserva') + '</button></div>';
    }
    overlay.classList.add('show'); sheet.classList.add('show');
  }
  function closeSheet() { overlay.classList.remove('show'); sheet.classList.remove('show'); }
  overlay.addEventListener('click', closeSheet);

  sheet.addEventListener('click', function (e) {
    var chip = e.target.closest('[data-r]');
    if (chip) {
      sheet.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('sel'); });
      chip.classList.add('sel'); reason = chip.dataset.r;
      document.getElementById('okBtn').disabled = false; return;
    }
    var b = e.target.closest('[data-sc]');
    if (!b) return;
    if (b.dataset.sc === 'close') return closeSheet();
    if (mode === 'approve') { cur.status = 'aprovada'; cur.decided = new Date(); toast('Reserva aprovada, morador notificado'); }
    if (mode === 'reject') { cur.status = 'recusada'; cur.decided = new Date(); cur.reason = reason; toast('Reserva recusada, morador notificado'); }
    if (mode === 'cancel') { cur.status = 'cancelada'; cur.decided = new Date(); cur.reason = reason; toast('Reserva cancelada, taxa removida do boleto'); }
    closeSheet(); render();
  });

  document.getElementById('list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (b && !b.disabled) openSheet(b.dataset.act, b.dataset.id);
  });
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active'); filter = t.dataset.f; render();
    });
  });
  document.getElementById('themeBtn').addEventListener('click', function () {
    var root = document.documentElement, c = root.getAttribute('data-theme');
    var isDark = c ? c === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  });

  render();
</script>
</body>
</html>
