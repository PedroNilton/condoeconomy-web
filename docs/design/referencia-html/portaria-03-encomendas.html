<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CondoEconomy — Encomendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#FAFAFA; --card:#FFFFFF; --border:#E4E4E8;
    --text:#16181D; --dim:#75767E; --faint:#A9AAB1;
    --primary:#4338CA; --primary-dim:#EEF0FF; --primary-ink:#FFFFFF;
    --success:#16A34A; --success-dim:#EAF8EF;
    --warning:#B45309; --warning-dim:#FEF3E2;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0E0F12; --card:#17181D; --border:#262832;
      --text:#ECEDF0; --dim:#90919A; --faint:#5D5E67;
      --primary:#6C63F5; --primary-dim:#201E3A; --primary-ink:#FFFFFF;
      --success:#34D399; --success-dim:#122A22;
      --warning:#F5A855; --warning-dim:#2E2214;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0E0F12; --card:#17181D; --border:#262832;
    --text:#ECEDF0; --dim:#90919A; --faint:#5D5E67;
    --primary:#6C63F5; --primary-dim:#201E3A; --primary-ink:#FFFFFF;
    --success:#34D399; --success-dim:#122A22;
    --warning:#F5A855; --warning-dim:#2E2214;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Manrope',system-ui,sans-serif; display:flex; justify-content:center; }
  .phone { width:100%; max-width:412px; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }

  header.top { padding:calc(16px + env(safe-area-inset-top,0px)) 18px 6px; display:flex; justify-content:space-between; align-items:center; }
  .h-title { font-size:19px; font-weight:800; letter-spacing:-.01em; }
  .h-sub { font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--primary); font-weight:600; margin-top:2px; text-transform:uppercase; }
  .h-actions { display:flex; gap:8px; }
  .icon-btn { width:40px; height:40px; border-radius:11px; border:1px solid var(--border); background:var(--card); display:grid; place-items:center; color:var(--text); cursor:pointer; }
  .icon-btn svg { width:18px; height:18px; }

  .page-head { padding:10px 18px 0; }
  .eyebrow { font-size:11px; font-weight:700; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; }
  h1 { font-size:21px; font-weight:800; margin:3px 0 14px; letter-spacing:-.01em; }
  .cta-row { display:grid; grid-template-columns:1fr 1.3fr; gap:10px; margin-bottom:14px; }
  .btn { font-family:inherit; font-size:14px; font-weight:700; height:50px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; }
  .btn svg { width:18px; height:18px; }
  .btn.primary { background:var(--primary); border-color:var(--primary); color:var(--primary-ink); }

  .search { position:relative; margin-bottom:12px; }
  .search svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--faint); }
  .search input { width:100%; height:46px; padding:0 13px 0 38px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font-family:inherit; font-size:14px; }
  .search input:focus-visible { outline:2px solid var(--primary); outline-offset:1px; }

  .tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:3px; padding:3px; background:var(--card); border:1px solid var(--border); border-radius:12px; }
  .tab { border:none; background:none; font-family:inherit; font-size:12px; font-weight:700; color:var(--dim); padding:9px 2px; border-radius:9px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .tab b { font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; color:var(--text); }
  .tab.active { background:var(--primary-dim); color:var(--primary); }
  .tab.active b { color:var(--primary); }

  main { flex:1; padding:14px 18px 110px; display:flex; flex-direction:column; gap:10px; }

  .p-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; }
  .p-card.long { border-color:var(--warning); }
  .p-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .p-unit { font-family:'IBM Plex Mono',monospace; font-size:14.5px; font-weight:600; }
  .badge { font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:700; padding:4px 8px; border-radius:999px; white-space:nowrap; flex:none; }
  .b-aguardando { background:var(--warning-dim); color:var(--warning); }
  .b-entregue { background:var(--success-dim); color:var(--success); }
  .p-who { font-size:13px; margin-top:6px; }
  .p-who span { color:var(--dim); }
  .p-code { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--faint); margin-top:4px; }
  .p-meta { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); margin-top:8px; display:flex; flex-direction:column; gap:3px; }
  .p-meta .warn { color:var(--warning); font-weight:600; }
  .p-action { margin-top:12px; width:100%; height:46px; border-radius:11px; font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer; border:1px solid var(--primary); background:var(--primary); color:var(--primary-ink); }

  .empty { text-align:center; padding:44px 20px; background:var(--card); border:1px solid var(--border); border-radius:14px; }
  .empty .e-t { font-size:14px; font-weight:700; margin-bottom:4px; }
  .empty .e-s { font-size:12.5px; color:var(--dim); line-height:1.5; }

  nav.bottom {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:412px;
    background:var(--card); border-top:1px solid var(--border);
    padding:9px 4px calc(9px + env(safe-area-inset-bottom,0px)); display:grid; grid-template-columns:repeat(6,1fr); z-index:5;
  }
  nav.bottom a { display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none; color:var(--faint); font-size:9.5px; font-weight:600; position:relative; }
  nav.bottom a svg { width:20px; height:20px; }
  nav.bottom a.active { color:var(--primary); }
  .nav-badge { position:absolute; top:-5px; left:calc(50% + 4px); background:var(--primary); color:#fff; font-size:9px; font-weight:700; min-width:15px; height:15px; border-radius:999px; display:grid; place-items:center; padding:0 4px; }

  .overlay { position:fixed; inset:0; background:rgba(10,10,14,.45); opacity:0; pointer-events:none; transition:opacity .2s; z-index:10; }
  .overlay.show { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; left:50%; bottom:0; transform:translate(-50%,100%); width:100%; max-width:412px; background:var(--card); border-radius:20px 20px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px)); z-index:11; transition:transform .25s ease; max-height:92vh; overflow-y:auto; }
  .sheet.show { transform:translate(-50%,0); }
  .sheet h2 { font-size:17px; font-weight:800; margin:0 0 6px; }
  .sheet .sum { font-size:12.5px; color:var(--dim); margin:0 0 16px; font-family:'IBM Plex Mono',monospace; }
  .lbl { font-size:12px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; display:block; }
  .sheet input[type="text"] { width:100%; height:46px; padding:0 13px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; font-size:14px; margin-bottom:16px; }
  .sheet input.mono { font-family:'IBM Plex Mono',monospace; font-weight:600; letter-spacing:.04em; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip { border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; font-size:12.5px; font-weight:600; padding:10px 13px; border-radius:10px; cursor:pointer; }
  .chip.sel { border-color:var(--primary); background:var(--primary-dim); color:var(--primary); }
  .note { font-size:11.5px; color:var(--dim); background:var(--primary-dim); color:var(--primary); border-radius:10px; padding:10px 12px; line-height:1.5; margin-bottom:16px; }
  .sheet-actions { display:grid; grid-template-columns:1fr 1.4fr; gap:10px; }

  .toast { position:fixed; bottom:84px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--text); color:var(--bg); font-size:13px; font-weight:600; padding:11px 18px; border-radius:10px; opacity:0; transition:transform .25s, opacity .25s; z-index:12; white-space:nowrap; }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>
<div class="phone">

  <header class="top">
    <div><div class="h-title">Portaria</div><div class="h-sub">Condomínio Mar Egeu</div></div>
    <div class="h-actions">
      <button class="icon-btn" id="themeBtn" aria-label="Alternar tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="icon-btn" aria-label="Sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </header>

  <div class="page-head">
    <div class="eyebrow">Recepção</div>
    <h1>Encomendas</h1>
    <div class="cta-row">
      <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M11 8v8M15 8v8M18 8v8"/></svg>Ler etiqueta</button>
      <button class="btn primary" id="openReg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Receber</button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="q" placeholder="Código, morador ou unidade">
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-f="todas">Todas<b id="c-todas">0</b></button>
      <button class="tab" data-f="aguardando">Aguardando<b id="c-aguardando">0</b></button>
      <button class="tab" data-f="entregue">Entregues<b id="c-entregue">0</b></button>
    </div>
  </div>

  <main id="list"></main>

  <nav class="bottom">
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 3l9 7"/><path d="M5 9v11h14V9"/></svg>Início</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/></svg>Visitantes</a>
    <a href="#" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Encomendas<span class="nav-badge" id="navBadge">0</span></a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>Reservas</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Ouvidoria</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2-5a2 2 0 0 1 2-1.3h10a2 2 0 0 1 2 1.3l2 5v5H3z"/><circle cx="7.5" cy="18" r="1.5"/><circle cx="16.5" cy="18" r="1.5"/></svg>Veículos</a>
  </nav>

  <div class="overlay" id="overlay"></div>

  <div class="sheet" id="regSheet">
    <h2>Receber encomenda</h2>
    <p class="sum">Registre na chegada, o morador é avisado.</p>
    <span class="lbl">Destino</span>
    <div class="two">
      <input type="text" class="mono" id="rBloco" placeholder="Bloco">
      <input type="text" class="mono" id="rApto" placeholder="Apto">
    </div>
    <span class="lbl">Destinatário</span>
    <input type="text" id="rNome" placeholder="Nome na etiqueta">
    <span class="lbl">Transportadora</span>
    <div class="chips" id="rCarrier">
      <button type="button" class="chip sel" data-v="Correios">Correios</button>
      <button type="button" class="chip" data-v="Mercado Livre">Mercado Livre</button>
      <button type="button" class="chip" data-v="Amazon">Amazon</button>
      <button type="button" class="chip" data-v="Shopee">Shopee</button>
      <button type="button" class="chip" data-v="Outra">Outra</button>
    </div>
    <span class="lbl">Código de rastreio (opcional)</span>
    <input type="text" class="mono" id="rCode" placeholder="Código da etiqueta">
    <div class="sheet-actions">
      <button class="btn" data-close>Cancelar</button>
      <button class="btn primary" id="saveReg">Registrar e avisar</button>
    </div>
  </div>

  <div class="sheet" id="delSheet">
    <h2>Confirmar entrega</h2>
    <p class="sum" id="delSum"></p>
    <span class="lbl">Quem está retirando?</span>
    <div class="chips" id="dWho">
      <button type="button" class="chip sel" data-v="dest">O próprio destinatário</button>
      <button type="button" class="chip" data-v="outra">Outra pessoa</button>
    </div>
    <div id="dNameWrap" style="display:none">
      <span class="lbl">Nome de quem retirou</span>
      <input type="text" id="dName" placeholder="Nome completo">
    </div>
    <div class="sheet-actions">
      <button class="btn" data-close>Cancelar</button>
      <button class="btn primary" id="saveDel">Confirmar entrega</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
  var HOUR = 3600000, DAY = 24 * HOUR;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function ago(ms) { return new Date(Date.now() - ms); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmt(d) { return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' · ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function rel(d) {
    var m = Math.floor((Date.now() - d.getTime()) / 60000);
    if (m < 1) return 'agora';
    if (m < 60) return 'há ' + m + ' min';
    var h = Math.floor(m / 60);
    if (h < 24) return 'há ' + h + ' h';
    var dd = Math.floor(h / 24);
    return 'há ' + dd + (dd === 1 ? ' dia' : ' dias');
  }

  var items = [
    {id:1, unit:'Bloco 05 · Apto 201', name:'Ana Beatriz', carrier:'Mercado Livre', code:'ML948201736BR', status:'aguardando', arrived:ago(2 * HOUR)},
    {id:2, unit:'Bloco 03 · Apto 102', name:'Fernanda Lima', carrier:'Amazon', code:'TBA318204957', status:'aguardando', arrived:ago(26 * HOUR)},
    {id:3, unit:'Bloco 08 · Apto 011', name:'Jorge Santos', carrier:'Shopee', code:'BR2208841750Q', status:'aguardando', arrived:ago(4 * DAY + 3 * HOUR)},
    {id:4, unit:'Bloco 11 · Apto 012', name:'Carlos Silva', carrier:'Correios', code:'NX775520331BR', status:'aguardando', arrived:ago(5 * DAY + HOUR)},
    {id:5, unit:'Bloco 07 · Apto 302', name:'João Lima', carrier:'Correios', code:'NX660143982BR', status:'entregue', arrived:ago(3 * DAY), picked:ago(2 * DAY + 4 * HOUR), by:'João Lima (destinatário)'},
    {id:6, unit:'Bloco 02 · Apto 101', name:'Marta Reis', carrier:'Mercado Livre', code:'', status:'entregue', arrived:ago(6 * DAY), picked:ago(5 * DAY), by:'Pedro Reis (outra pessoa)'}
  ];
  var nextId = 7, filter = 'todas', delId = null;

  function render() {
    var q = document.getElementById('q').value.trim().toLowerCase();
    var waiting = items.filter(function (i) { return i.status === 'aguardando'; }).length;
    document.getElementById('c-todas').textContent = items.length;
    document.getElementById('c-aguardando').textContent = waiting;
    document.getElementById('c-entregue').textContent = items.length - waiting;
    var nb = document.getElementById('navBadge');
    nb.textContent = waiting; nb.style.display = waiting ? 'grid' : 'none';

    var shown = items.filter(function (i) {
      var okF = filter === 'todas' || i.status === filter;
      var hay = (i.unit + ' ' + i.name + ' ' + i.carrier + ' ' + i.code).toLowerCase();
      return okF && (!q || hay.indexOf(q) > -1);
    }).sort(function (a, b) {
      if (a.status !== b.status) return a.status === 'aguardando' ? -1 : 1;
      return a.status === 'aguardando' ? a.arrived - b.arrived : b.picked - a.picked;
    });

    var list = document.getElementById('list');
    if (!shown.length) {
      var msg = q ? ['Nada encontrado', 'Confira o código, o nome ou a unidade digitados.']
        : filter === 'aguardando' ? ['Nenhuma encomenda aguardando', 'Tudo entregue por aqui. Novas chegadas aparecem nesta lista.']
        : filter === 'entregue' ? ['Nenhuma entrega registrada', 'As encomendas entregues ficam aqui como histórico.']
        : ['Nenhuma encomenda', 'Registre as chegadas em Receber para avisar o morador.'];
      list.innerHTML = '<div class="empty"><div class="e-t">' + msg[0] + '</div><div class="e-s">' + msg[1] + '</div></div>';
      return;
    }
    list.innerHTML = shown.map(function (i) {
      var long = i.status === 'aguardando' && Date.now() - i.arrived.getTime() >= 3 * DAY;
      var meta = '<span class="' + (long ? 'warn' : '') + '">Chegou ' + fmt(i.arrived) + ' · ' + rel(i.arrived) + '</span>';
      if (i.status === 'entregue') meta += '<span>Retirada ' + fmt(i.picked) + ' · por ' + esc(i.by) + '</span>';
      return '<div class="p-card' + (long ? ' long' : '') + '">' +
        '<div class="p-top"><div class="p-unit">' + esc(i.unit) + '</div><span class="badge b-' + i.status + '">' + (i.status === 'aguardando' ? 'AGUARDANDO' : 'ENTREGUE') + '</span></div>' +
        '<div class="p-who">' + esc(i.name) + ' <span>· ' + esc(i.carrier) + '</span></div>' +
        (i.code ? '<div class="p-code">' + esc(i.code) + '</div>' : '') +
        '<div class="p-meta">' + meta + '</div>' +
        (i.status === 'aguardando' ? '<button class="p-action" data-id="' + i.id + '">Entregar</button>' : '') + '</div>';
    }).join('');
  }

  function toast(t) {
    var el = document.getElementById('toast');
    el.textContent = t; el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  var overlay = document.getElementById('overlay');
  function openSheet(id) { overlay.classList.add('show'); document.getElementById(id).classList.add('show'); }
  function closeSheets() { overlay.classList.remove('show'); document.querySelectorAll('.sheet').forEach(function (s) { s.classList.remove('show'); }); }
  overlay.addEventListener('click', closeSheets);
  document.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', closeSheets); });

  function chipGroup(id, cb) {
    document.querySelectorAll('#' + id + ' .chip').forEach(function (c) {
      c.addEventListener('click', function () {
        document.querySelectorAll('#' + id + ' .chip').forEach(function (x) { x.classList.remove('sel'); });
        c.classList.add('sel'); cb(c.dataset.v);
      });
    });
  }
  var carrier = 'Correios', who = 'dest';
  chipGroup('rCarrier', function (v) { carrier = v; });
  chipGroup('dWho', function (v) { who = v; document.getElementById('dNameWrap').style.display = v === 'outra' ? 'block' : 'none'; });

  document.getElementById('openReg').addEventListener('click', function () { openSheet('regSheet'); });
  document.getElementById('saveReg').addEventListener('click', function () {
    var bloco = document.getElementById('rBloco').value.trim() || '—';
    var apto = document.getElementById('rApto').value.trim() || '—';
    items.push({id:nextId++, unit:'Bloco ' + bloco + ' · Apto ' + apto, name:document.getElementById('rNome').value.trim() || 'Sem nome', carrier:carrier, code:document.getElementById('rCode').value.trim(), status:'aguardando', arrived:new Date()});
    ['rBloco','rApto','rNome','rCode'].forEach(function (id) { document.getElementById(id).value = ''; });
    closeSheets(); filter = 'aguardando';
    document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('active', x.dataset.f === 'aguardando'); });
    render(); toast('Encomenda registrada, morador avisado');
  });

  document.getElementById('list').addEventListener('click', function (e) {
    var btn = e.target.closest('.p-action');
    if (!btn) return;
    delId = +btn.dataset.id;
    var it = items.filter(function (x) { return x.id === delId; })[0];
    document.getElementById('delSum').textContent = it.unit + ' · ' + it.name;
    document.getElementById('dName').value = '';
    openSheet('delSheet');
  });
  document.getElementById('saveDel').addEventListener('click', function () {
    var it = items.filter(function (x) { return x.id === delId; })[0];
    it.status = 'entregue'; it.picked = new Date();
    it.by = who === 'dest' ? it.name + ' (destinatário)' : (document.getElementById('dName').value.trim() || 'Nome não informado') + ' (outra pessoa)';
    closeSheets(); render(); toast('Entrega registrada');
  });

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active'); filter = t.dataset.f; render();
    });
  });
  document.getElementById('q').addEventListener('input', render);

  document.getElementById('themeBtn').addEventListener('click', function () {
    var root = document.documentElement, cur = root.getAttribute('data-theme');
    var isDark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  });

  render();
</script>
</body>
</html>
