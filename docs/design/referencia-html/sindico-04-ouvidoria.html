<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CondoEconomy — Ouvidoria (Síndico)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#FAFAFA; --card:#FFFFFF; --border:#E4E4E8;
    --text:#16181D; --dim:#75767E; --faint:#A9AAB1;
    --primary:#4338CA; --primary-dim:#EEF0FF; --primary-ink:#FFFFFF;
    --success:#16A34A; --success-dim:#EAF8EF;
    --warning:#B45309; --warning-dim:#FEF3E2;
    --danger:#DC2626; --danger-dim:#FDECEC;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0E0F12; --card:#17181D; --border:#262832;
      --text:#ECEDF0; --dim:#90919A; --faint:#5D5E67;
      --primary:#6C63F5; --primary-dim:#201E3A; --primary-ink:#FFFFFF;
      --success:#34D399; --success-dim:#122A22;
      --warning:#F5A855; --warning-dim:#2E2214;
      --danger:#F87171; --danger-dim:#331A1A;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0E0F12; --card:#17181D; --border:#262832;
    --text:#ECEDF0; --dim:#90919A; --faint:#5D5E67;
    --primary:#6C63F5; --primary-dim:#201E3A; --primary-ink:#FFFFFF;
    --success:#34D399; --success-dim:#122A22;
    --warning:#F5A855; --warning-dim:#2E2214;
    --danger:#F87171; --danger-dim:#331A1A;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Manrope',system-ui,sans-serif; display:flex; justify-content:center; }
  .phone { width:100%; max-width:412px; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }

  header.top { padding:calc(16px + env(safe-area-inset-top,0px)) 18px 6px; display:flex; justify-content:space-between; align-items:center; }
  .h-title { font-size:19px; font-weight:800; letter-spacing:-.01em; }
  .h-sub { font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--primary); font-weight:600; margin-top:2px; text-transform:uppercase; }
  .h-actions { display:flex; gap:8px; }
  .icon-btn { width:40px; height:40px; border-radius:11px; border:1px solid var(--border); background:var(--card); display:grid; place-items:center; color:var(--text); cursor:pointer; }
  .icon-btn svg { width:18px; height:18px; }

  .page-head { padding:10px 18px 0; }
  .eyebrow-row { display:flex; justify-content:space-between; align-items:center; }
  .eyebrow { font-size:11px; font-weight:700; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; }
  .live { display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--success); letter-spacing:.03em; }
  .live i { width:6px; height:6px; border-radius:50%; background:var(--success); animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
  @media (prefers-reduced-motion: reduce) { .live i { animation:none; } }
  h1 { font-size:21px; font-weight:800; margin:3px 0 4px; letter-spacing:-.01em; }
  .lede { font-size:12.5px; color:var(--dim); margin:0 0 14px; }

  .search { position:relative; margin-bottom:12px; }
  .search svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--faint); }
  .search input { width:100%; height:46px; padding:0 13px 0 38px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font-family:inherit; font-size:14px; }
  .search input:focus-visible { outline:2px solid var(--primary); outline-offset:1px; }

  .tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:3px; padding:3px; background:var(--card); border:1px solid var(--border); border-radius:12px; }
  .tab { border:none; background:none; font-family:inherit; font-size:12px; font-weight:700; color:var(--dim); padding:9px 2px; border-radius:9px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .tab b { font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; color:var(--text); }
  .tab.active { background:var(--primary-dim); color:var(--primary); }
  .tab.active b { color:var(--primary); }

  main { flex:1; padding:14px 18px 110px; display:flex; flex-direction:column; gap:10px; }

  .c-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; }
  .c-card.long { border-color:var(--warning); }
  .c-top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; }
  .cat { font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--bg); color:var(--dim); border:1px solid var(--border); letter-spacing:.03em; }
  .cat.sec { background:var(--danger-dim); color:var(--danger); border-color:var(--danger-dim); }
  .c-time { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--faint); }
  .c-time.warn { color:var(--warning); font-weight:600; }
  .c-subject { font-size:14.5px; font-weight:700; }
  .c-prev { font-size:12.5px; color:var(--dim); line-height:1.5; margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .esc { margin-top:10px; font-size:12px; line-height:1.5; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:9px 11px; color:var(--dim); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .esc b { color:var(--text); font-weight:700; }
  .c-who { display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); font-size:12.5px; }
  .c-who span { font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px; }
  .c-who em { font-style:normal; color:var(--dim); }
  .link-btn { background:none; border:none; color:var(--primary); font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer; padding:6px 0 6px 10px; }
  .c-actions { display:grid; gap:10px; margin-top:10px; }
  .c-actions.two { grid-template-columns:1fr 1fr; }
  .btn { font-family:inherit; font-size:13.5px; font-weight:700; height:46px; border-radius:11px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; }
  .btn.primary { background:var(--primary); border-color:var(--primary); color:var(--primary-ink); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .c-done { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--success); margin-top:8px; }

  .empty { text-align:center; padding:40px 20px; background:var(--card); border:1px solid var(--border); border-radius:16px; }
  .empty .e-ico { width:56px; height:56px; border-radius:50%; border:3px solid var(--success); color:var(--success); display:grid; place-items:center; margin:0 auto 14px; opacity:.85; }
  .empty .e-ico svg { width:26px; height:26px; }
  .empty .e-ico.n { border-color:var(--border); color:var(--faint); }
  .empty .e-t { font-size:15px; font-weight:800; margin-bottom:4px; }
  .empty .e-s { font-size:12.5px; color:var(--dim); line-height:1.5; }

  nav.bottom {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:412px;
    background:var(--card); border-top:1px solid var(--border);
    padding:9px 4px calc(9px + env(safe-area-inset-bottom,0px)); display:grid; grid-template-columns:repeat(5,1fr); z-index:5;
  }
  nav.bottom a { display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none; color:var(--faint); font-size:9.5px; font-weight:600; position:relative; }
  nav.bottom a svg { width:20px; height:20px; }
  nav.bottom a.active { color:var(--primary); }
  .nav-badge { position:absolute; top:-5px; left:calc(50% + 4px); background:var(--primary); color:#fff; font-size:9px; font-weight:700; min-width:15px; height:15px; border-radius:999px; display:grid; place-items:center; padding:0 4px; }

  .overlay { position:fixed; inset:0; background:rgba(10,10,14,.45); opacity:0; pointer-events:none; transition:opacity .2s; z-index:10; }
  .overlay.show { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; left:50%; bottom:0; transform:translate(-50%,100%); width:100%; max-width:412px; background:var(--card); border-radius:20px 20px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px)); z-index:11; transition:transform .25s ease; max-height:92vh; display:flex; flex-direction:column; }
  .sheet.show { transform:translate(-50%,0); }
  .s-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:4px; }
  .s-head h2 { font-size:16.5px; font-weight:800; margin:0; }
  .close-btn { width:34px; height:34px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); display:grid; place-items:center; cursor:pointer; flex:none; }
  .close-btn svg { width:15px; height:15px; }
  .s-sub { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); margin-bottom:12px; flex-wrap:wrap; }
  .s-sub span { font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .thread { overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:2px 0 12px; max-height:40vh; }
  .bubble { max-width:86%; padding:10px 12px; border-radius:14px; font-size:13px; line-height:1.5; background:var(--bg); border:1px solid var(--border); align-self:flex-start; }
  .bubble.p { align-self:flex-end; }
  .bubble.s { align-self:flex-end; background:var(--primary-dim); border-color:var(--primary-dim); }
  .bubble small { display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--faint); margin-top:4px; }
  .bubble.s small { color:var(--primary); opacity:.85; }
  .reply { display:flex; gap:8px; padding-top:12px; border-top:1px solid var(--border); }
  .reply input, .sheet textarea { flex:1; height:46px; padding:0 13px; border-radius:11px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; font-size:14px; }
  .sheet textarea { width:100%; height:auto; min-height:96px; padding:11px 13px; resize:none; margin-bottom:14px; }
  .reply button { height:46px; padding:0 18px; border-radius:11px; border:none; background:var(--primary); color:var(--primary-ink); font-family:inherit; font-weight:700; font-size:13.5px; cursor:pointer; }
  .s-note { font-size:12px; color:var(--success); background:var(--success-dim); border-radius:10px; padding:10px 12px; line-height:1.5; }
  .s-hint { font-size:11px; color:var(--dim); margin-top:8px; line-height:1.4; }
  .lbl { font-size:12px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; display:block; }
  .sheet-actions { display:grid; grid-template-columns:1fr 1.4fr; gap:10px; }

  .toast { position:fixed; bottom:84px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--text); color:var(--bg); font-size:13px; font-weight:600; padding:11px 18px; border-radius:10px; opacity:0; transition:transform .25s, opacity .25s; z-index:12; white-space:nowrap; max-width:92%; overflow:hidden; text-overflow:ellipsis; }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>
<div class="phone">

  <header class="top">
    <div><div class="h-title">Síndico</div><div class="h-sub">Ana Laura (síndica)</div></div>
    <div class="h-actions">
      <button class="icon-btn" id="themeBtn" aria-label="Alternar tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="icon-btn" aria-label="Sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </header>

  <div class="page-head">
    <div class="eyebrow-row"><span class="eyebrow">Ouvidoria</span><span class="live"><i></i>AO VIVO</span></div>
    <h1>Demandas dos moradores</h1>
    <p class="lede">Chamados escalados pela portaria para a administração.</p>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="q" placeholder="Buscar assunto, morador ou unidade">
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-f="novo">Novos<b id="c-novo">0</b></button>
      <button class="tab" data-f="andamento">Em andamento<b id="c-andamento">0</b></button>
      <button class="tab" data-f="resolvido">Resolvidos<b id="c-resolvido">0</b></button>
    </div>
  </div>

  <main id="list"></main>

  <nav class="bottom">
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>Avisos</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>Reservas<span class="nav-badge">2</span></a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>Assembleia</a>
    <a href="#" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v4M12 14h.01"/></svg>Ouvidoria<span class="nav-badge" id="navBadge">0</span></a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 3l9 7"/><path d="M5 9v11h14V9"/></svg>Condomínio</a>
  </nav>

  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="detail"></div>
  <div class="sheet" id="resolveSheet">
    <div class="s-head"><h2>Resolver chamado</h2></div>
    <div class="s-sub" id="rSub"></div>
    <span class="lbl">Resposta final ao morador (opcional)</span>
    <textarea id="rText" placeholder="Conte o que foi feito para resolver"></textarea>
    <div class="sheet-actions"><button class="btn" data-close>Voltar</button><button class="btn primary" id="rOk">Resolver chamado</button></div>
    <div class="s-hint">O morador é notificado de que o chamado foi resolvido.</div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
  var MIN = 60000, HOUR = 60 * MIN, DAY = 24 * HOUR;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function ago(ms) { return new Date(Date.now() - ms); }
  function rel(d) {
    var m = Math.floor((Date.now() - d.getTime()) / 60000);
    if (m < 1) return 'agora';
    if (m < 60) return 'há ' + m + ' min';
    var h = Math.floor(m / 60);
    if (h < 24) return 'há ' + h + ' h';
    var dd = Math.floor(h / 24);
    return 'há ' + dd + (dd === 1 ? ' dia' : ' dias');
  }
  var WHO = {m:'Morador', p:'Portaria', s:'Você'};

  var items = [
    {id:1, cat:'Segurança', subject:'Portão da garagem não fecha', unit:'Bloco 03 · Apto 102', who:'Fernanda Lima', status:'novo', esc:ago(20 * MIN),
      note:'Verifiquei no local: o sensor do portão parece com defeito. Precisa de manutenção técnica.',
      msgs:[{f:'m', t:'O portão do Bloco 03 fica aberto depois que passa o carro. À noite isso é perigoso.', at:ago(48 * MIN)}, {f:'p', t:'Recebido. Estou escalando para a administração acionar a manutenção.', at:ago(20 * MIN)}]},
    {id:2, cat:'Reclamação', subject:'Barulho de obra fora do horário', unit:'Bloco 07 · Apto 302', who:'João Lima', status:'novo', esc:ago(26 * HOUR),
      note:'Já conversei com o morador responsável pela obra, mas continuam. Precisa de advertência formal.',
      msgs:[{f:'m', t:'Estão furando parede desde as 7h de sábado. O regimento não permite nesse horário.', at:ago(30 * HOUR)}, {f:'p', t:'Conversei com o morador, mas o barulho continua. Escalei para a síndica.', at:ago(26 * HOUR)}]},
    {id:3, cat:'Sugestão', subject:'Cobrir o bicicletário', unit:'Bloco 11 · Apto 012', who:'Carlos Silva', status:'andamento', esc:ago(2 * DAY),
      note:'Sugestão que depende de orçamento. Vale levar para assembleia.',
      msgs:[{f:'m', t:'Sugiro cobrir o bicicletário. As bicicletas pegam chuva e enferrujam.', at:ago(3 * DAY)}, {f:'p', t:'Obrigado pela sugestão. Vou encaminhar para a administração.', at:ago(2 * DAY)}, {f:'s', t:'Vou pedir orçamento e colocar em pauta na próxima assembleia.', at:ago(1 * DAY)}]},
    {id:4, cat:'Manutenção', subject:'Vazamento na garagem do bloco 05', unit:'Bloco 05 · Apto 201', who:'Ana Beatriz', status:'resolvido', esc:ago(5 * DAY), resolvedAt:ago(3 * DAY),
      note:'Vazamento em tubulação do prédio, fora da alçada da portaria.',
      msgs:[{f:'m', t:'Tem água escorrendo perto da minha vaga há dois dias.', at:ago(6 * DAY)}, {f:'p', t:'Escalado para a administração.', at:ago(5 * DAY)}, {f:'s', t:'Encanador contratado e reparo concluído. Obrigada por avisar.', at:ago(3 * DAY)}]},
    {id:5, cat:'Reclamação', subject:'Barulho após 22h no salão', unit:'Bloco 08 · Apto 011', who:'Jorge Santos', status:'resolvido', esc:ago(7 * DAY), resolvedAt:ago(6 * DAY),
      note:'Reincidência de morador. Cabe à administração aplicar o regimento.',
      msgs:[{f:'m', t:'Festa no salão passou do horário permitido de novo.', at:ago(8 * DAY)}, {f:'p', t:'Escalado por ser reincidência.', at:ago(7 * DAY)}, {f:'s', t:'Morador notificado formalmente conforme o regimento.', at:ago(6 * DAY)}]}
  ];
  var filter = 'novo', openId = null, resolveId = null;

  function byId(id) { return items.filter(function (i) { return i.id === +id; })[0]; }
  function isLong(i) { return i.status === 'novo' && Date.now() - i.esc.getTime() >= DAY; }

  function card(i) {
    var long = isLong(i), replies = i.msgs.length - 1;
    var actions = i.status === 'novo'
      ? '<div class="c-actions"><button class="btn primary" data-act="take" data-id="' + i.id + '">Assumir atendimento</button></div>'
      : i.status === 'andamento'
      ? '<div class="c-actions two"><button class="btn" data-act="open" data-id="' + i.id + '">Responder</button><button class="btn primary" data-act="resolve" data-id="' + i.id + '">Resolver</button></div>'
      : '<div class="c-done">Resolvido ' + rel(i.resolvedAt) + '</div><div class="c-actions"><button class="btn" data-act="reopen" data-id="' + i.id + '">Reabrir</button></div>';
    return '<div class="c-card' + (long ? ' long' : '') + '">' +
      '<div class="c-top"><span class="cat' + (i.cat === 'Segurança' ? ' sec' : '') + '">' + i.cat.toUpperCase() + '</span><span class="c-time' + (long ? ' warn' : '') + '">Escalado ' + rel(i.esc) + '</span></div>' +
      '<div class="c-subject">' + esc(i.subject) + '</div>' +
      '<div class="c-prev">' + esc(i.msgs[0].t) + '</div>' +
      '<div class="esc"><b>Nota da portaria:</b> ' + esc(i.note) + '</div>' +
      '<div class="c-who"><div><span>' + esc(i.unit) + '</span> <em>· ' + esc(i.who) + '</em></div><button class="link-btn" data-act="open" data-id="' + i.id + '">Conversa (' + i.msgs.length + ')</button></div>' + actions + '</div>';
  }

  function render() {
    var q = document.getElementById('q').value.trim().toLowerCase();
    ['novo', 'andamento', 'resolvido'].forEach(function (s) {
      document.getElementById('c-' + s).textContent = items.filter(function (i) { return i.status === s; }).length;
    });
    var n = items.filter(function (i) { return i.status === 'novo'; }).length;
    var nb = document.getElementById('navBadge'); nb.textContent = n; nb.style.display = n ? 'grid' : 'none';

    var shown = items.filter(function (i) {
      return i.status === filter && (!q || (i.subject + ' ' + i.unit + ' ' + i.who + ' ' + i.cat).toLowerCase().indexOf(q) > -1);
    }).sort(function (a, b) {
      if (filter === 'novo') {
        var sa = a.cat === 'Segurança' ? 0 : 1, sb = b.cat === 'Segurança' ? 0 : 1;
        return sa !== sb ? sa - sb : a.esc - b.esc;
      }
      return filter === 'andamento' ? a.esc - b.esc : b.resolvedAt - a.resolvedAt;
    });
    var list = document.getElementById('list');
    if (!shown.length) {
      var msg = q ? ['Nada encontrado', 'Confira o assunto, o nome ou a unidade digitados.', 1]
        : filter === 'novo' ? ['Tudo em dia!', 'Nenhum chamado escalado para a administração no momento.', 0]
        : filter === 'andamento' ? ['Nenhum chamado em andamento', 'Ao assumir um chamado, ele passa para esta aba.', 1]
        : ['Nenhum chamado resolvido', 'Os chamados concluídos ficam aqui como histórico.', 1];
      list.innerHTML = '<div class="empty"><div class="e-ico' + (msg[2] ? ' n' : '') + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="e-t">' + msg[0] + '</div><div class="e-s">' + msg[1] + '</div></div>';
      return;
    }
    list.innerHTML = shown.map(card).join('');
  }

  function toast(t) {
    var el = document.getElementById('toast');
    el.textContent = t; el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  var overlay = document.getElementById('overlay'), detail = document.getElementById('detail'), rsheet = document.getElementById('resolveSheet');
  function closeAll() { overlay.classList.remove('show'); detail.classList.remove('show'); rsheet.classList.remove('show'); openId = null; }
  overlay.addEventListener('click', closeAll);
  document.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', closeAll); });

  function renderDetail() {
    var i = byId(openId);
    var thread = i.msgs.map(function (m) {
      return '<div class="bubble ' + m.f + '">' + esc(m.t) + '<small>' + WHO[m.f] + ' · ' + rel(m.at) + '</small></div>';
    }).join('');
    var foot = i.status === 'resolvido'
      ? '<div class="s-note">Chamado resolvido ' + rel(i.resolvedAt) + '. Reabra para responder novamente.</div>'
      : '<div class="reply"><input type="text" id="rInput" placeholder="Escrever resposta ao morador"><button id="rSend">Enviar</button></div>' +
        (i.status === 'novo' ? '<div class="s-hint">Ao responder, você assume o atendimento e o chamado vai para Em andamento.</div>' : '');
    detail.innerHTML = '<div class="s-head"><h2>' + esc(i.subject) + '</h2><button class="close-btn" id="closeD" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>' +
      '<div class="s-sub"><span class="cat' + (i.cat === 'Segurança' ? ' sec' : '') + '">' + i.cat.toUpperCase() + '</span><span>' + esc(i.unit) + '</span> · ' + esc(i.who) + '</div>' +
      '<div class="thread" id="thread">' + thread + '</div>' + foot;
    var t = document.getElementById('thread'); t.scrollTop = t.scrollHeight;
  }
  function openDetail(id) { openId = +id; renderDetail(); overlay.classList.add('show'); detail.classList.add('show'); }

  detail.addEventListener('click', function (e) {
    if (e.target.closest('#closeD')) return closeAll();
    if (e.target.closest('#rSend')) sendReply();
  });
  detail.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'rInput') sendReply(); });
  function sendReply() {
    var inp = document.getElementById('rInput'), v = inp.value.trim();
    if (!v) return;
    var i = byId(openId);
    i.msgs.push({f:'s', t:v, at:new Date()});
    var took = i.status === 'novo';
    if (took) i.status = 'andamento';
    render(); renderDetail();
    document.getElementById('rInput').focus();
    toast(took ? 'Resposta enviada, você assumiu o chamado' : 'Resposta enviada');
  }

  document.getElementById('list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var i = byId(b.dataset.id), a = b.dataset.act;
    if (a === 'open') return openDetail(i.id);
    if (a === 'resolve') {
      resolveId = i.id;
      document.getElementById('rSub').innerHTML = '<span>' + esc(i.unit) + '</span> · ' + esc(i.subject);
      document.getElementById('rText').value = '';
      overlay.classList.add('show'); rsheet.classList.add('show'); return;
    }
    if (a === 'take') { i.status = 'andamento'; toast('Você assumiu o chamado'); }
    if (a === 'reopen') { i.status = 'andamento'; i.resolvedAt = null; toast('Chamado reaberto'); }
    render();
  });

  document.getElementById('rOk').addEventListener('click', function () {
    var i = byId(resolveId), v = document.getElementById('rText').value.trim();
    if (v) i.msgs.push({f:'s', t:v, at:new Date()});
    i.status = 'resolvido'; i.resolvedAt = new Date();
    closeAll(); render(); toast('Chamado resolvido, morador notificado');
  });

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active'); filter = t.dataset.f; render();
    });
  });
  document.getElementById('q').addEventListener('input', render);

  document.getElementById('themeBtn').addEventListener('click', function () {
    var root = document.documentElement, c = root.getAttribute('data-theme');
    var isDark = c ? c === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  });

  render();
</script>
</body>
</html>
