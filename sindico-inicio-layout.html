<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CondoEconomy — Síndico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#FAFAFA; --card:#FFFFFF; --border:#E4E4E8;
    --text:#16181D; --dim:#75767E; --faint:#A9AAB1;
    --primary:#4338CA; --primary-dim:#EEF0FF; --primary-ink:#FFFFFF;
    --success:#16A34A; --success-dim:#EAF8EF;
    --warning:#B45309; --warning-dim:#FEF3E2;
    --danger:#DC2626; --danger-dim:#FDECEC;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0E0F12; --card:#17181D; --border:#262832;
      --text:#ECEDF0; --dim:#90919A; --faint:#5D5E67;
      --primary:#6C63F5; --primary-dim:#201E3A; --primary-ink:#FFFFFF;
      --success:#34D399; --success-dim:#122A22;
      --warning:#F5A855; --warning-dim:#2E2214;
      --danger:#F87171; --danger-dim:#331A1A;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0E0F12; --card:#17181D; --border:#262832;
    --text:#ECEDF0; --dim:#90919A; --faint:#5D5E67;
    --primary:#6C63F5; --primary-dim:#201E3A; --primary-ink:#FFFFFF;
    --success:#34D399; --success-dim:#122A22;
    --warning:#F5A855; --warning-dim:#2E2214;
    --danger:#F87171; --danger-dim:#331A1A;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Manrope',system-ui,sans-serif; display:flex; justify-content:center; }
  .phone { width:100%; max-width:412px; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }

  header.top { padding:calc(16px + env(safe-area-inset-top,0px)) 18px 6px; display:flex; justify-content:space-between; align-items:center; }
  .h-title { font-size:19px; font-weight:800; letter-spacing:-.01em; }
  .h-sub { font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--primary); font-weight:600; margin-top:2px; text-transform:uppercase; }
  .h-actions { display:flex; gap:8px; }
  .icon-btn { width:40px; height:40px; border-radius:11px; border:1px solid var(--border); background:var(--card); display:grid; place-items:center; color:var(--text); cursor:pointer; }
  .icon-btn svg { width:18px; height:18px; }

  main { flex:1; padding:10px 18px 110px; display:flex; flex-direction:column; gap:22px; }
  .greet h1 { font-size:22px; font-weight:800; margin:0; letter-spacing:-.01em; }
  .greet p { font-size:12.5px; color:var(--dim); margin:4px 0 0; }
  .chips { display:flex; gap:8px; overflow-x:auto; margin-top:14px; }
  .sc { flex:none; display:flex; align-items:center; gap:7px; height:38px; padding:0 13px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--text); font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer; }
  .sc svg { width:15px; height:15px; color:var(--dim); }

  .sec-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; }
  .group { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .att { width:100%; display:flex; align-items:center; gap:12px; padding:13px 14px; border:none; border-bottom:1px solid var(--border); background:none; color:var(--text); font-family:inherit; text-align:left; cursor:pointer; }
  .att:last-child { border-bottom:none; }
  .att .a-ico { width:36px; height:36px; border-radius:10px; display:grid; place-items:center; flex:none; background:var(--primary-dim); color:var(--primary); }
  .att .a-ico svg { width:17px; height:17px; }
  .att .a-ico.w { background:var(--warning-dim); color:var(--warning); }
  .att .a-ico.d { background:var(--danger-dim); color:var(--danger); }
  .att .a-body { flex:1; min-width:0; }
  .att .a-t { font-size:13.5px; font-weight:700; }
  .att .a-s { font-size:11.5px; color:var(--dim); margin-top:2px; }
  .att .a-n { font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; }
  .att .chev { color:var(--faint); }
  .att .chev svg { width:15px; height:15px; }

  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; }
  .stat .s-num { font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:600; line-height:1; }
  .stat .s-label { font-size:10.5px; color:var(--dim); margin-top:6px; line-height:1.3; }

  .btn { font-family:inherit; font-size:13px; font-weight:700; height:38px; padding:0 14px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .btn svg { width:15px; height:15px; }
  .btn.primary { background:var(--primary); border-color:var(--primary); color:var(--primary-ink); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }

  .notice { position:relative; background:var(--card); border:1px solid var(--border); border-left:3px solid var(--primary); border-radius:14px; padding:14px 14px 12px 16px; margin-bottom:10px; }
  .n-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .n-title { font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:6px; }
  .n-title svg { width:13px; height:13px; color:var(--primary); flex:none; }
  .n-date { font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--primary); background:var(--primary-dim); padding:4px 8px; border-radius:7px; white-space:nowrap; flex:none; }
  .n-cat { display:inline-block; margin-top:6px; font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--bg); border:1px solid var(--border); color:var(--dim); letter-spacing:.03em; }
  .n-body { font-size:12.5px; color:var(--dim); line-height:1.55; margin:8px 0 12px; }
  .n-foot { display:flex; justify-content:space-between; align-items:center; gap:10px; padding-top:10px; border-top:1px solid var(--border); }
  .n-by { font-size:11px; color:var(--primary); font-weight:700; }
  .n-seen { flex:1; max-width:150px; }
  .n-seen small { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--dim); display:block; margin-bottom:4px; text-align:right; }
  .bar { height:4px; border-radius:999px; background:var(--border); overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--success); }
  .kebab { background:none; border:none; color:var(--faint); cursor:pointer; padding:2px 4px; }
  .kebab svg { width:16px; height:16px; }
  .menu-row { display:none; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); align-items:center; justify-content:space-between; }
  .menu-row.show { display:flex; }
  .menu-row .ctext { font-size:12px; color:var(--dim); }
  .mini { font-family:inherit; font-size:12px; font-weight:700; padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; }
  .mini.danger { background:var(--danger); border-color:var(--danger); color:#fff; }
  .empty { text-align:center; padding:36px 20px; background:var(--card); border:1px solid var(--border); border-radius:14px; font-size:13px; color:var(--dim); }

  nav.bottom {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:412px;
    background:var(--card); border-top:1px solid var(--border);
    padding:9px 4px calc(9px + env(safe-area-inset-bottom,0px)); display:grid; grid-template-columns:repeat(5,1fr); z-index:5;
  }
  nav.bottom a { display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none; color:var(--faint); font-size:9.5px; font-weight:600; position:relative; }
  nav.bottom a svg { width:20px; height:20px; }
  nav.bottom a.active { color:var(--primary); }
  .nav-badge { position:absolute; top:-5px; left:calc(50% + 4px); background:var(--primary); color:#fff; font-size:9px; font-weight:700; min-width:15px; height:15px; border-radius:999px; display:grid; place-items:center; padding:0 4px; }

  .overlay { position:fixed; inset:0; background:rgba(10,10,14,.45); opacity:0; pointer-events:none; transition:opacity .2s; z-index:10; }
  .overlay.show { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; left:50%; bottom:0; transform:translate(-50%,100%); width:100%; max-width:412px; background:var(--card); border-radius:20px 20px 0 0; padding:20px 20px calc(22px + env(safe-area-inset-bottom,0px)); z-index:11; transition:transform .25s ease; max-height:92vh; overflow-y:auto; }
  .sheet.show { transform:translate(-50%,0); }
  .sheet h2 { font-size:17px; font-weight:800; margin:0 0 16px; }
  .lbl { font-size:12px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; display:block; }
  .sheet input[type="text"], .sheet textarea { width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; font-size:14px; margin-bottom:16px; }
  .sheet textarea { resize:none; min-height:96px; }
  .opts { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip { border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; font-size:12.5px; font-weight:600; padding:9px 12px; border-radius:10px; cursor:pointer; }
  .chip.sel { border-color:var(--primary); background:var(--primary-dim); color:var(--primary); }
  .blocks { display:none; grid-template-columns:repeat(7,1fr); gap:6px; margin:-4px 0 16px; }
  .blocks.show { display:grid; }
  .blocks .chip { padding:9px 0; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:12px; }
  .tog { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--border); }
  .tog:last-of-type { margin-bottom:14px; border-bottom:1px solid var(--border); }
  .tog .t1 { font-size:13.5px; font-weight:700; }
  .tog .t2 { font-size:11.5px; color:var(--dim); margin-top:2px; line-height:1.45; }
  .switch { position:relative; width:40px; height:23px; flex:none; margin-top:2px; }
  .switch input { opacity:0; width:0; height:0; }
  .switch .track { position:absolute; inset:0; background:var(--border); border-radius:999px; transition:background .15s; }
  .switch .thumb { position:absolute; top:2.5px; left:2.5px; width:18px; height:18px; background:#fff; border-radius:50%; transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + .track { background:var(--primary); }
  .switch input:checked + .track .thumb { transform:translateX(17px); }
  .reach { font-size:12px; color:var(--dim); margin-bottom:14px; font-family:'IBM Plex Mono',monospace; }
  .sheet-actions { display:grid; grid-template-columns:1fr 1.4fr; gap:10px; }
  .sheet-actions .btn { height:48px; justify-content:center; font-size:14px; }

  .toast { position:fixed; bottom:84px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--text); color:var(--bg); font-size:13px; font-weight:600; padding:11px 18px; border-radius:10px; opacity:0; transition:transform .25s, opacity .25s; z-index:12; white-space:nowrap; max-width:92%; overflow:hidden; text-overflow:ellipsis; }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>
<div class="phone">

  <header class="top">
    <div><div class="h-title">Síndico</div><div class="h-sub">Ana Laura (síndica)</div></div>
    <div class="h-actions">
      <button class="icon-btn" id="themeBtn" aria-label="Alternar tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="icon-btn" aria-label="Sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </header>

  <main>
    <section class="greet">
      <h1 id="greeting">Olá, Ana Laura</h1>
      <p id="today"></p>
      <div class="chips">
        <button class="sc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Moradores</button>
        <button class="sc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Encomendas</button>
        <button class="sc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/></svg>Segurança</button>
      </div>
    </section>

    <section>
      <p class="sec-title">Precisa da sua atenção</p>
      <div class="group">
        <button class="att">
          <span class="a-ico w"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg></span>
          <span class="a-body"><div class="a-t">Reservas para aprovar</div><div class="a-s">A mais antiga espera há 1 dia</div></span>
          <span class="a-n">2</span><span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
        </button>
        <button class="att">
          <span class="a-ico d"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v4M12 14h.01"/></svg></span>
          <span class="a-body"><div class="a-t">Chamados abertos</div><div class="a-s">1 é de segurança</div></span>
          <span class="a-n">3</span><span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
        </button>
        <button class="att">
          <span class="a-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l3 3v17H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span>
          <span class="a-body"><div class="a-t">Boletos vencidos</div><div class="a-s">R$ 2.880,00 em aberto</div></span>
          <span class="a-n">6</span><span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
        </button>
      </div>
    </section>

    <section>
      <p class="sec-title">Hoje no condomínio</p>
      <div class="stats">
        <div class="stat"><div class="s-num">5</div><div class="s-label">Visitantes hoje</div></div>
        <div class="stat"><div class="s-num">4</div><div class="s-label">Encomendas aguardando</div></div>
        <div class="stat"><div class="s-num">2</div><div class="s-label">Reservas hoje</div></div>
      </div>
    </section>

    <section>
      <p class="sec-title">Comunicação</p>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:-2px 0 12px">
        <h2 style="font-size:18px;font-weight:800;margin:0">Mural de avisos</h2>
        <button class="btn primary" id="openCompose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Novo aviso</button>
      </div>
      <div id="notices"></div>
    </section>
  </main>

  <nav class="bottom">
    <a href="#" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>Avisos</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>Reservas<span class="nav-badge">2</span></a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>Assembleia</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v4M12 14h.01"/></svg>Ouvidoria<span class="nav-badge">3</span></a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 3l9 7"/><path d="M5 9v11h14V9"/></svg>Condomínio</a>
  </nav>

  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet">
    <h2>Novo aviso</h2>
    <span class="lbl">Título</span>
    <input type="text" id="cTitle" placeholder="Ex: Limpeza da garagem">
    <span class="lbl">Mensagem</span>
    <textarea id="cBody" placeholder="Escreva o aviso para os moradores"></textarea>
    <span class="lbl">Categoria</span>
    <div class="opts" id="cCat">
      <button type="button" class="chip sel" data-v="Aviso geral">Aviso geral</button>
      <button type="button" class="chip" data-v="Manutenção">Manutenção</button>
      <button type="button" class="chip" data-v="Limpeza">Limpeza</button>
      <button type="button" class="chip" data-v="Segurança">Segurança</button>
      <button type="button" class="chip" data-v="Evento">Evento</button>
      <button type="button" class="chip" data-v="Financeiro">Financeiro</button>
    </div>
    <span class="lbl">Quem recebe</span>
    <div class="opts" id="cAud">
      <button type="button" class="chip sel" data-v="all">Todo o condomínio</button>
      <button type="button" class="chip" data-v="blocks">Blocos específicos</button>
    </div>
    <div class="blocks" id="blocks"></div>
    <div class="reach" id="reach"></div>
    <label class="tog"><span><div class="t1">Fixar no topo do mural</div><div class="t2">Fica acima dos demais avisos.</div></span><span class="switch"><input type="checkbox" id="cPin"><span class="track"><span class="thumb"></span></span></span></label>
    <label class="tog"><span><div class="t1">Notificar moradores agora</div><div class="t2">Envia push. Quem desativou comunicados nas preferências não recebe.</div></span><span class="switch"><input type="checkbox" id="cPush" checked><span class="track"><span class="thumb"></span></span></span></label>
    <div class="sheet-actions">
      <button class="btn" id="cCancel">Cancelar</button>
      <button class="btn primary" id="cPublish" disabled>Publicar aviso</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
  var TOTAL = 168, PER_BLOCK = 12;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function ago(days) { return new Date(Date.now() - days * 86400000); }
  function fmtDate(d) { return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); }

  var h = new Date().getHours();
  document.getElementById('greeting').textContent = (h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite') + ', Ana Laura';
  document.getElementById('today').textContent = new Date().toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'}) + ' · Condomínio Mar Egeu';

  var PIN = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M16 3a1 1 0 0 1 .7 1.7L15 6.4v4.2l2.7 3.3a1 1 0 0 1-.8 1.6H13v5a1 1 0 0 1-2 0v-5H7.1a1 1 0 0 1-.8-1.6L9 10.6V6.4L7.3 4.7A1 1 0 0 1 8 3h8z"/></svg>';
  var notices = [
    {id:1, title:'Assembleia ordinária', body:'A assembleia ordinária acontece no salão de festas, às 20h. A presença de um representante por unidade é importante para o quórum.', cat:'Evento', by:'Síndico', at:ago(3), pinned:true, seen:96, total:TOTAL, menu:'closed'},
    {id:2, title:'Limpeza da Garagem', body:'A limpeza da garagem ocorrerá no próximo sábado. Por favor, retirem seus veículos entre 08h e 12h.', cat:'Limpeza', by:'Síndico', at:ago(1), seen:118, total:TOTAL, menu:'closed'},
    {id:3, title:'Manutenção da Piscina', body:'A piscina ficará interditada nesta quinta-feira para tratamento de choque na água. Agradecemos a compreensão.', cat:'Manutenção', by:'Administração', at:ago(2), seen:143, total:TOTAL, menu:'closed'}
  ];
  var nextId = 4;

  function menuHtml(n) {
    if (n.menu === 'open') return '<div class="menu-row show"><button class="mini" data-act="pin" data-id="' + n.id + '">' + (n.pinned ? 'Desafixar' : 'Fixar no topo') + '</button><button class="mini danger" data-act="ask" data-id="' + n.id + '">Excluir</button></div>';
    if (n.menu === 'confirm') return '<div class="menu-row show"><span class="ctext">Excluir este aviso?</span><span style="display:flex;gap:8px"><button class="mini" data-act="cancel" data-id="' + n.id + '">Cancelar</button><button class="mini danger" data-act="del" data-id="' + n.id + '">Excluir</button></span></div>';
    return '';
  }
  function renderNotices() {
    var list = notices.slice().sort(function (a, b) { return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.at - a.at; });
    document.getElementById('notices').innerHTML = list.length ? list.map(function (n) {
      var pct = n.total ? Math.round(n.seen / n.total * 100) : 0;
      return '<div class="notice"><div class="n-top"><div><div class="n-title">' + (n.pinned ? PIN : '') + esc(n.title) + '</div><span class="n-cat">' + esc(n.cat).toUpperCase() + '</span></div>' +
        '<div style="display:flex;align-items:center;gap:4px"><span class="n-date">' + fmtDate(n.at) + '</span><button class="kebab" data-act="menu" data-id="' + n.id + '" aria-label="Mais opções"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button></div></div>' +
        '<div class="n-body">' + esc(n.body) + '</div>' +
        '<div class="n-foot"><span class="n-by">Enviado por: ' + esc(n.by) + '</span><div class="n-seen"><small>Visto por ' + n.seen + ' de ' + n.total + '</small><div class="bar"><i style="width:' + pct + '%"></i></div></div></div>' +
        menuHtml(n) + '</div>';
    }).join('') : '<div class="empty">Nenhum aviso publicado. Use "Novo aviso" para comunicar algo aos moradores.</div>';
  }

  function toast(t) {
    var el = document.getElementById('toast');
    el.textContent = t; el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 2400);
  }
  function byId(id) { return notices.filter(function (n) { return n.id === +id; })[0]; }

  document.getElementById('notices').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var n = byId(b.dataset.id), a = b.dataset.act;
    if (a === 'menu') n.menu = n.menu === 'closed' ? 'open' : 'closed';
    if (a === 'pin') { n.pinned = !n.pinned; n.menu = 'closed'; toast(n.pinned ? 'Aviso fixado no topo' : 'Aviso desafixado'); }
    if (a === 'ask') n.menu = 'confirm';
    if (a === 'cancel') n.menu = 'closed';
    if (a === 'del') { notices = notices.filter(function (x) { return x.id !== n.id; }); toast('Aviso excluído'); }
    renderNotices();
  });

  var overlay = document.getElementById('overlay'), sheet = document.getElementById('sheet');
  var cat = 'Aviso geral', aud = 'all', picked = {};
  function reachUnits() { return aud === 'all' ? TOTAL : Object.keys(picked).length * PER_BLOCK; }
  function updateCompose() {
    var u = reachUnits();
    document.getElementById('reach').textContent = aud === 'all' ? 'Alcance: ' + TOTAL + ' unidades' : (u ? 'Alcance: ' + Object.keys(picked).length + ' bloco(s) · ' + u + ' unidades' : 'Escolha ao menos um bloco');
    var ok = document.getElementById('cTitle').value.trim() && document.getElementById('cBody').value.trim() && u > 0;
    document.getElementById('cPublish').disabled = !ok;
  }
  var blocksEl = document.getElementById('blocks');
  for (var i = 1; i <= 14; i++) {
    var c = document.createElement('button'); c.type = 'button'; c.className = 'chip'; c.textContent = pad(i); c.dataset.b = i;
    c.addEventListener('click', function () { var k = this.dataset.b; if (picked[k]) { delete picked[k]; this.classList.remove('sel'); } else { picked[k] = 1; this.classList.add('sel'); } updateCompose(); });
    blocksEl.appendChild(c);
  }
  function group(id, cb) {
    document.querySelectorAll('#' + id + ' .chip').forEach(function (c) {
      c.addEventListener('click', function () {
        document.querySelectorAll('#' + id + ' .chip').forEach(function (x) { x.classList.remove('sel'); });
        c.classList.add('sel'); cb(c.dataset.v);
      });
    });
  }
  group('cCat', function (v) { cat = v; });
  group('cAud', function (v) { aud = v; blocksEl.classList.toggle('show', v === 'blocks'); updateCompose(); });
  document.getElementById('cTitle').addEventListener('input', updateCompose);
  document.getElementById('cBody').addEventListener('input', updateCompose);

  function open() { overlay.classList.add('show'); sheet.classList.add('show'); updateCompose(); }
  function close() { overlay.classList.remove('show'); sheet.classList.remove('show'); }
  document.getElementById('openCompose').addEventListener('click', open);
  document.getElementById('cCancel').addEventListener('click', close);
  overlay.addEventListener('click', close);

  document.getElementById('cPublish').addEventListener('click', function () {
    var u = reachUnits();
    notices.push({id:nextId++, title:document.getElementById('cTitle').value.trim(), body:document.getElementById('cBody').value.trim(), cat:cat, by:'Síndico', at:new Date(), pinned:document.getElementById('cPin').checked, seen:0, total:u, menu:'closed'});
    var push = document.getElementById('cPush').checked;
    document.getElementById('cTitle').value = ''; document.getElementById('cBody').value = '';
    document.getElementById('cPin').checked = false;
    close(); renderNotices();
    toast('Aviso publicado para ' + u + ' unidades' + (push ? ' · push enviado' : ''));
  });

  document.getElementById('themeBtn').addEventListener('click', function () {
    var root = document.documentElement, cur = root.getAttribute('data-theme');
    var isDark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  });

  renderNotices(); updateCompose();
</script>
</body>
</html>
